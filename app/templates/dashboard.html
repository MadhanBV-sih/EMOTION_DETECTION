{% extends "base.html" %}

{% block content %}
<div class="flex flex-col h-[calc(100vh-4rem)]">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <div
                class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center font-bold text-xl">
                {{ username[0].upper() }}
            </div>
            <h1 class="text-2xl font-bold">Dashboard</h1>
        </div>
        <a href="{{ url_for('auth.logout') }}"
            class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg transition text-sm font-medium">
            Logout
        </a>
    </div>

    <!-- Main Content -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Video Feed -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            <div
                class="relative rounded-3xl overflow-hidden bg-black/50 aspect-video shadow-2xl border border-white/10 group">
                <video id="video" autoplay muted playsinline
                    class="w-full h-full object-cover transform -scale-x-100"></video>

                <!-- Overlay -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="loader" class="text-center">
                        <div
                            class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto mb-4">
                        </div>
                        <p class="text-purple-300 font-medium animate-pulse">Accessing Camera...</p>
                    </div>
                </div>

                <!-- Controls -->
                <div
                    class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex gap-4 pointer-events-auto opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <button id="toggle-btn"
                        class="px-6 py-2 bg-white/20 backdrop-blur-md hover:bg-white/30 rounded-full font-medium transition">
                        Pause
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats / Emotion Display -->
        <div class="lg:col-span-1 flex flex-col gap-6">
            <!-- Current Emotion Card -->
            <div id="emotion-card"
                class="glass p-8 rounded-3xl flex flex-col items-center justify-center flex-1 transition-all duration-500">
                <div id="emoji-display" class="text-8xl mb-4 filter drop-shadow-lg transition-transform duration-300">😐
                </div>
                <h2 id="emotion-label"
                    class="text-5xl font-bold tracking-wide capitalize bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                    Neutral
                </h2>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}

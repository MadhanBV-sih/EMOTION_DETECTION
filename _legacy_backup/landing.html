<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Realm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* Background Image */
        .bg-image {
            background-image: url('./static/images/bg.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) contrast(1.1);
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Gradient Text */
        .text-gradient {
            background: linear-gradient(to right, #a7f3d0, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Cinzel', serif;
        }

        /* Colorful Input Border */
        .input-wrapper {
            position: relative;
            background: linear-gradient(90deg, #34d399, #3b82f6, #a855f7);
            padding: 2px;
            border-radius: 9999px;
        }

        .input-inner {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 9999px;
        }

        input:focus {
            outline: none;
        }

        /* Avatar Float Animation */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .avatar-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Button Glow */
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
        }
    </style>
</head>

<body class="h-screen w-screen relative flex items-center justify-center">

    <!-- Background -->
    <div class="absolute inset-0 bg-image z-0"></div>

    <!-- Fog Overlay (CSS Gradient) -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30 z-0 pointer-events-none">
    </div>

    <!-- Main Container -->
    <main class="relative z-10 flex flex-col items-center gap-8 w-full max-w-4xl px-4">

        <!-- Glass Card -->
        <div
            class="glass-panel rounded-[40px] p-12 w-full max-w-2xl flex flex-col items-center text-center relative overflow-hidden">

            <!-- Decorative Glow -->
            <div
                class="absolute top-[-50%] left-[-50%] w-[200%] h-[200%] bg-gradient-to-br from-emerald-500/10 to-purple-500/10 rounded-full blur-[100px] pointer-events-none">
            </div>

            <!-- Avatar -->
            <div class="relative w-48 h-48 mb-6 avatar-float perspective-1000">
                <img id="avatar" src="./static/images/avatar.png" alt="Avatar"
                    class="w-full h-full object-contain drop-shadow-2xl transition-transform duration-100 ease-out transform-style-3d">
            </div>

            <!-- Title -->
            <h1 class="text-4xl md:text-6xl font-bold text-white mb-2 tracking-wider font-cinzel">
                <span class="text-gradient">ASCEND</span>
            </h1>
            <p class="text-slate-300/80 text-lg mb-10 font-light tracking-wide">Enter your name to begin the journey</p>

            <!-- Colorful Input -->
            <div class="input-wrapper w-full max-w-md transition-transform duration-300 hover:scale-105">
                <div class="input-inner flex items-center p-1">
                    <input type="text" placeholder="Traveler Name..."
                        class="bg-transparent text-white px-6 py-3 w-full text-lg placeholder-slate-500/70">
                    <button onclick="enterApp()"
                        class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-8 py-3 rounded-full font-semibold tracking-wide transition-all duration-300 hover:brightness-110 btn-glow">
                        ENTER
                    </button>
                </div>
            </div>

        </div>

    </main>

    <script>
        const avatar = document.getElementById('avatar');
        const container = document.body;

        // Mouse Tracking for Avatar
        container.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;

            // Calculate percentage position (-1 to 1)
            const x = (clientX / innerWidth - 0.5) * 2;
            const y = (clientY / innerHeight - 0.5) * 2;

            // Rotate avatar slightly based on mouse position
            // Max rotation: 15 degrees
            const rotateX = -y * 15;
            const rotateY = x * 15;

            avatar.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Reset on mouse leave
        container.addEventListener('mouseleave', () => {
            avatar.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });

        function enterApp() {
            // Animation out
            document.querySelector('main').style.opacity = '0';
            document.querySelector('main').style.transform = 'scale(0.9)';
            document.querySelector('main').style.transition = 'all 0.8s ease-in-out';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        }
    </script>
</body>

</html>
